</head><body>

<style>
/* Layout: a quiet page-tree sidebar on the left, one wide document page on the right, content laid out as plain blocks. */
:root{
  --bg:#ffffff; --side:#f6f5f2; --fg:#2c2b28; --muted:#75736d; --faint:#a9a69f; --line:#e8e6e1; --hover:#efede8;
  --accent:var(--acc-l); --on-accent:var(--oa-l); --accent-soft:var(--accs-l); --good:#2d8455; --bad:#cf4655; --card:#ffffff; --shadow:0 8px 30px rgba(30,28,24,.14),0 1px 3px rgba(30,28,24,.08);
  --gray-bg:#ecebe8; --gray-fg:#5f5d58; --brown-bg:#f1e6de; --brown-fg:#7a5236; --orange-bg:#fbe6d4; --orange-fg:#a65316;
  --yellow-bg:#f8efc8; --yellow-fg:#85650c; --green-bg:#e1f0e4; --green-fg:#2f6e43; --blue-bg:#dfeafa; --blue-fg:#2a5ea8;
  --purple-bg:#ece4f7; --purple-fg:#6a45a0; --pink-bg:#f8e1ec; --pink-fg:#a03a6c; --red-bg:#fbe2df; --red-fg:#b23a2f;
  --font-ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-title:"Newsreader",Georgia,"Times New Roman",serif; --title-w:600; --title-ls:-.01em; --title-scale:1; --radius:10px;
  --acc-l:#2f6bd8; --acc-d:#78a6ff; --accs-l:#e7effc; --accs-d:#23314d; --oa-l:#ffffff; --oa-d:#0f1d36;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1c1b19; --side:#232220; --fg:#e8e6e1; --muted:#a29f98; --faint:#6e6b65; --line:#34322e; --hover:#2c2b28;
  --accent:var(--acc-d); --on-accent:var(--oa-d); --accent-soft:var(--accs-d); --good:#5cc28a; --bad:#f07a88; --card:#252421; --shadow:0 8px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --gray-bg:#3a3935; --gray-fg:#cdcac3; --brown-bg:#45352b; --brown-fg:#dbb9a0; --orange-bg:#4d3423; --orange-fg:#f0ad78;
  --yellow-bg:#47401f; --yellow-fg:#e8cf73; --green-bg:#23392b; --green-fg:#8fd1a3; --blue-bg:#22344f; --blue-fg:#94bcf5;
  --purple-bg:#36294a; --purple-fg:#c3a6ef; --pink-bg:#45283a; --pink-fg:#eea0c6; --red-bg:#4a2826; --red-fg:#f39b91;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1c1b19; --side:#232220; --fg:#e8e6e1; --muted:#a29f98; --faint:#6e6b65; --line:#34322e; --hover:#2c2b28;
  --accent:var(--acc-d); --on-accent:var(--oa-d); --accent-soft:var(--accs-d); --good:#5cc28a; --bad:#f07a88; --card:#252421; --shadow:0 8px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --gray-bg:#3a3935; --gray-fg:#cdcac3; --brown-bg:#45352b; --brown-fg:#dbb9a0; --orange-bg:#4d3423; --orange-fg:#f0ad78;
  --yellow-bg:#47401f; --yellow-fg:#e8cf73; --green-bg:#23392b; --green-fg:#8fd1a3; --blue-bg:#22344f; --blue-fg:#94bcf5;
  --purple-bg:#36294a; --purple-fg:#c3a6ef; --pink-bg:#45283a; --pink-fg:#eea0c6; --red-bg:#4a2826; --red-fg:#f39b91;
  color-scheme:dark }

/* Explicit choice from the planner's own Appearance page wins over the system and host setting */
:root.lp-light{
  --bg:#ffffff; --side:#f6f5f2; --fg:#2c2b28; --muted:#75736d; --faint:#a9a69f; --line:#e8e6e1; --hover:#efede8;
  --accent:var(--acc-l); --on-accent:var(--oa-l); --accent-soft:var(--accs-l); --good:#2d8455; --bad:#cf4655; --card:#ffffff; --shadow:0 8px 30px rgba(30,28,24,.14),0 1px 3px rgba(30,28,24,.08);
  --gray-bg:#ecebe8; --gray-fg:#5f5d58; --brown-bg:#f1e6de; --brown-fg:#7a5236; --orange-bg:#fbe6d4; --orange-fg:#a65316;
  --yellow-bg:#f8efc8; --yellow-fg:#85650c; --green-bg:#e1f0e4; --green-fg:#2f6e43; --blue-bg:#dfeafa; --blue-fg:#2a5ea8;
  --purple-bg:#ece4f7; --purple-fg:#6a45a0; --pink-bg:#f8e1ec; --pink-fg:#a03a6c; --red-bg:#fbe2df; --red-fg:#b23a2f;
  color-scheme:light }
:root.lp-dark{
  --bg:#1c1b19; --side:#232220; --fg:#e8e6e1; --muted:#a29f98; --faint:#6e6b65; --line:#34322e; --hover:#2c2b28;
  --accent:var(--acc-d); --on-accent:var(--oa-d); --accent-soft:var(--accs-d); --good:#5cc28a; --bad:#f07a88; --card:#252421; --shadow:0 8px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --gray-bg:#3a3935; --gray-fg:#cdcac3; --brown-bg:#45352b; --brown-fg:#dbb9a0; --orange-bg:#4d3423; --orange-fg:#f0ad78;
  --yellow-bg:#47401f; --yellow-fg:#e8cf73; --green-bg:#23392b; --green-fg:#8fd1a3; --blue-bg:#22344f; --blue-fg:#94bcf5;
  --purple-bg:#36294a; --purple-fg:#c3a6ef; --pink-bg:#45283a; --pink-fg:#eea0c6; --red-bg:#4a2826; --red-fg:#f39b91;
  color-scheme:dark }
/* Templates */
:root[data-tpl="minimal"]{ --font-title:"Inter",ui-sans-serif,system-ui,sans-serif; --title-w:600; --title-ls:-.03em; --title-scale:.92; --radius:6px;
  --acc-l:#37352f; --acc-d:#e3e1db; --accs-l:#ecebe8; --accs-d:#34322e; --oa-l:#ffffff; --oa-d:#1c1b19 }
:root[data-tpl="notebook"]{ --font-title:"Caveat","Segoe Print","Bradley Hand",cursive; --title-w:700; --title-ls:0; --title-scale:1.3; --radius:4px;
  --acc-l:#b5562b; --acc-d:#f0a074; --accs-l:#f8e6da; --accs-d:#4a2f22; --oa-l:#ffffff; --oa-d:#2a160c }
:root[data-tpl="modern"]{ --font-title:"Space Grotesk","Inter",ui-sans-serif,sans-serif; --title-w:600; --title-ls:-.03em; --title-scale:1; --radius:12px;
  --acc-l:#6a3fd1; --acc-d:#b49cff; --accs-l:#eee7fd; --accs-d:#33284f; --oa-l:#ffffff; --oa-d:#1b1233 }
:root[data-tpl="soft"]{ --font-title:"Nunito","Inter",ui-sans-serif,sans-serif; --font-ui:"Nunito","Inter",ui-sans-serif,system-ui,sans-serif; --title-w:800; --title-ls:-.01em; --title-scale:1; --radius:16px;
  --acc-l:#2f8f6a; --acc-d:#6fd3a8; --accs-l:#e2f3ea; --accs-d:#1f3a30; --oa-l:#ffffff; --oa-d:#0d2219 }
:root[data-tpl="rose"]{ --font-title:"Playfair Display",Georgia,serif; --title-w:600; --title-ls:0; --title-scale:1; --radius:10px;
  --acc-l:#b83b6b; --acc-d:#f29bbd; --accs-l:#fae4ed; --accs-d:#46253a; --oa-l:#ffffff; --oa-d:#2b0f1d }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

.t-gray{--tb:var(--gray-bg);--tf:var(--gray-fg)} .t-brown{--tb:var(--brown-bg);--tf:var(--brown-fg)} .t-orange{--tb:var(--orange-bg);--tf:var(--orange-fg)}
.t-yellow{--tb:var(--yellow-bg);--tf:var(--yellow-fg)} .t-green{--tb:var(--green-bg);--tf:var(--green-fg)} .t-blue{--tb:var(--blue-bg);--tf:var(--blue-fg)}
.t-purple{--tb:var(--purple-bg);--tf:var(--purple-fg)} .t-pink{--tb:var(--pink-bg);--tf:var(--pink-fg)} .t-red{--tb:var(--red-bg);--tf:var(--red-fg)}

/* App shell */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding-block:14px 18px;padding-right:8px;padding-left:max(8px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.ws{display:flex;align-items:center;gap:10px;padding:6px 10px 14px}
.ws-mark{width:26px;height:26px;border-radius:6px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--font-title);font-weight:600;font-size:16px}
.ws-name{font-weight:600;font-size:14.5px}
.ws-sub{font-size:12px;color:var(--muted)}
.nav-group{font-size:11.5px;font-weight:500;color:var(--faint);padding:14px 10px 4px;letter-spacing:.04em;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--hover);color:var(--fg)}
.nav a.on{background:var(--hover);color:var(--fg)}
.nav a .ico{color:var(--faint)} .nav a.on .ico{color:var(--fg)}
.nav a .count{margin-left:auto;font-size:12px;color:var(--faint)}
.side-foot{margin-top:auto;padding:16px 10px 0;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync.ok i{background:var(--good)} .sync.warn i{background:var(--bad)} .sync.wait i{background:var(--yellow-fg)}
.linkbtn{background:none;border:0;padding:3px 0;text-align:left;color:var(--muted);font-size:12.5px}
.linkbtn:hover{color:var(--fg);text-decoration:underline}
.ico{width:18px;height:18px;flex:none;display:inline-grid;place-items:center}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.topbar{display:none}
.scrim{display:none}

/* Page */
.page{max-width:1040px;margin:0 auto;padding-block:44px 120px;padding-left:max(clamp(16px,5vw,72px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,5vw,72px),env(safe-area-inset-right,0px))}
.ph{margin-bottom:22px}
.ph-icon{width:46px;height:46px;border-radius:10px;background:var(--side);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:14px;color:var(--fg)}
.ph-icon .ico,.ph-icon .ico svg{width:24px;height:24px}
.ph-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-title);font-weight:var(--title-w);font-size:calc(var(--title-scale) * clamp(30px,4.2vw,40px));line-height:1.1;margin:0;letter-spacing:var(--title-ls);text-wrap:balance}
.ph-sub{color:var(--muted);margin:8px 0 0;max-width:62ch}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h2{font-size:18px;font-weight:600;margin:0}
h3{font-size:13px;font-weight:600;margin:0;color:var(--muted);letter-spacing:.02em}
.stack{display:flex;flex-direction:column;gap:28px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 32px}
.block{min-width:0;display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.empty{color:var(--faint);font-size:13.5px;padding:6px 0}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 11px;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn .ico,.btn .ico svg{width:15px;height:15px}
.icon-btn{border:0;background:transparent;border-radius:5px;width:28px;height:28px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn .ico,.icon-btn .ico svg{width:16px;height:16px}
.seg{display:inline-flex;background:var(--side);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:5px;padding:3px 10px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.navrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.navrow .label{font-weight:600;font-size:15px;min-width:0;padding:0 6px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--tb,var(--gray-bg));color:var(--tf,var(--gray-fg));border-radius:4px;padding:0 6px;font-size:12.5px;line-height:20px;white-space:nowrap;font-weight:500}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.chk{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--faint);background:transparent;display:grid;place-items:center;padding:0;flex:none}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on::after{content:"";width:9px;height:5px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg)}
.input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 10px;width:100%;min-width:0}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:70px;line-height:1.5}
.bare{border:0;background:transparent;width:100%;padding:4px 0;resize:none;outline:none;min-height:24px;line-height:1.55}
.bare::placeholder,.input::placeholder{color:var(--faint)}

/* Lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:7px 6px;border-bottom:1px solid var(--line);border-radius:4px;min-width:0}
.row:hover{background:var(--hover)}
.row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .title{background:none;border:0;padding:0;text-align:left;font-weight:500;color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .title:hover{text-decoration:underline}
.row.done .title{color:var(--faint);text-decoration:line-through}
.time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;width:74px;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--tf);flex:none}
.quick{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px}
.quick .ico{color:var(--faint)}
.quick input{border:0;background:transparent;outline:none;flex:1;min-width:0;padding:4px 0}
.table-wrap{overflow-x:auto;border-top:1px solid var(--line)}
table.db{border-collapse:collapse;width:100%;min-width:560px}
table.db th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.db td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.db tr:hover td{background:var(--hover)}
td.amt,th.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--fg)}
.over{color:var(--bad)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{background:var(--bg);padding:12px 14px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px}
.stat .s{font-size:12px;color:var(--faint)}
.bar{height:8px;background:var(--side);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over > i{background:var(--bad)}
.bar.good > i{background:var(--good)}

/* Callout */
.callout{display:flex;gap:12px;align-items:flex-start;background:var(--side);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:22px;flex-wrap:wrap}
.callout p{margin:0;flex:1;min-width:220px}
.callout .acts{display:flex;gap:8px;flex-wrap:wrap}

/* Calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
.month .dow{font-size:12px;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:500}
.cell{min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.cell:hover{background:var(--hover)}
.cell.out{background:var(--side)} .cell.out .dnum{color:var(--faint)}
.dnum{font-size:12.5px;font-weight:500;align-self:flex-end;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.cell.today .dnum{background:var(--bad);color:#fff}
.chip{display:block;width:100%;text-align:left;border:0;background:var(--tb);color:var(--tf);border-radius:4px;padding:1px 6px;font-size:12px;line-height:18px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.chip.task{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.chip .tm{opacity:.75;font-weight:400;margin-right:4px}
.more{font-size:11.5px;color:var(--muted);padding-left:6px}
.weekgrid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.weekgrid{display:grid;grid-template-columns:52px repeat(7,minmax(96px,1fr));min-width:740px}
.wg-h{padding:8px 6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted)}
.wg-h b{display:block;font-size:20px;color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.wg-h.today b{color:var(--bad)}
.wg-allday{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;min-height:28px}
.wg-hours{position:relative}
.wg-hours div{height:44px;font-size:11px;color:var(--faint);text-align:right;padding-right:6px;transform:translateY(-7px)}
.wg-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 44px;cursor:pointer}

.ff-top h2{margin:0}
.ff-search{display:flex;gap:8px}
.ff-search .input{flex:1;min-width:0}
.ff-res{max-height:50vh;overflow:auto;border-top:1px solid var(--line)}
.ff-row{border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;color:var(--fg);cursor:pointer}
.ff-row:hover{background:var(--hover)}
.ff-rn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ff-pick{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ff-name{font-weight:600;font-size:16px}
.ff-amt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ff-amt .input{width:100px}
.ff-nut{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;width:100%}
.ff-nut div{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13.5px;background:var(--card)}
.ff-nut span{color:var(--muted)}
.ff-photo{display:flex;flex-direction:column;gap:10px}
.ff-img{max-width:100%;max-height:220px;border-radius:10px;object-fit:cover;align-self:flex-start}
.ff-est{display:flex;flex-direction:column;gap:10px}
.ff-ei{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--side)}
.ff-ei.off{opacity:.5}
.ff-eh{display:flex;align-items:center;gap:8px}
.ff-en{flex:1;min-width:0;font-weight:600}
.ff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.ff-grid label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.mbars{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.mb-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:3px}
.mb-h b{color:var(--fg)}
.mbar .bar{height:6px}
.calc-h{display:flex;align-items:center;gap:6px}
.calc-h .input{width:64px}
.calc-out{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px;background:var(--side)}
/* Food guide */
.guide{display:flex;flex-direction:column;gap:8px}
.guide-cats{display:flex;flex-wrap:wrap;gap:6px}
.guide-list{margin-top:6px}
.guide-row{gap:12px;align-items:center}
.guide-n{font-weight:500}
.guide-bar{height:5px;margin-top:6px;max-width:320px}
.guide-amt{text-align:right;white-space:nowrap;min-width:72px}
.guide-add{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;color:var(--accent)}
.ilist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.shop-g{margin-bottom:10px}
.shop-h{padding:2px 0 4px;font-weight:500}
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tip{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);font-size:13.5px}
.tip span{color:var(--muted)}
.ai-ideas{margin-bottom:20px}
/* Workouts library */
.wk-tabs{margin-bottom:20px}
.wk-rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:26px}
.wk-rc{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px 18px;background:var(--card);color:var(--fg);cursor:pointer;min-width:0;overflow:hidden;transition:box-shadow .15s,transform .15s}
.wk-rc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tf)}
.wk-rc:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.wk-rc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wk-rc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wk-rc-h b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-rc-ex{display:flex;flex-direction:column;gap:3px;font-size:13px;flex:1}
.wk-rc-ex>div{display:flex;justify-content:space-between;gap:8px}
.wk-rc-ex>div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-rc-f{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:9px}
.wk-new{align-items:center;justify-content:center;flex-direction:row;border-style:dashed;color:var(--muted);font-weight:500;min-height:120px;background:transparent;padding-left:14px}
.wk-new::before{display:none}
.wk-intro{border:1px dashed var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:24px}
.wk-intro h3{margin:0;font-size:17px} .wk-intro p{margin:0;max-width:520px}
.wk-today{align-items:center}
.wk-back{border:0;background:none;color:var(--muted);padding:4px 0;margin-bottom:10px;font:inherit;font-size:13.5px;cursor:pointer}
.wk-back:hover{color:var(--fg)}
.wk-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;border-left:5px solid var(--tf);padding:4px 0 4px 14px;margin-bottom:22px}
.wk-hero-a{display:flex;gap:8px;flex-wrap:wrap}
.wk-tbl{display:flex;flex-direction:column}
.wk-tr{display:grid;grid-template-columns:minmax(110px,1.2fr) minmax(120px,1.5fr) minmax(110px,1.3fr) 70px;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:baseline}
.wk-th{font-size:11.5px;color:var(--faint);border-top:0;padding-top:0}
.wk-pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.wk-pick select{width:auto;max-width:100%}
.wk-prrow{border-left:0;border-right:0;border-top:0;background:transparent;width:100%;color:var(--fg);font:inherit;cursor:pointer}
.wk-col{display:flex;flex-direction:column;gap:24px}
.vb{fill:var(--accent);opacity:.45} .vb.cur{opacity:1}
@media (max-width:640px){ .wk-rgrid{grid-template-columns:minmax(0,1fr)} .wk-tr{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:2px} .wk-tr>*:nth-child(n+3){font-size:12px} .wk-th span:nth-child(n+3){display:none} .wk-tr:not(.wk-th)>span:nth-child(3)::before{content:'Last: '} .wk-tr:not(.wk-th)>span:nth-child(4)::before{content:'Best: '} .wk-tabs .seg button{padding-left:8px;padding-right:8px} }
/* Workout log grid */
.wl-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.wl-title{margin:0;font-family:var(--font-title);font-weight:var(--title-w);font-size:24px}
.wl-today{color:var(--accent);font-weight:600}
.wl-grid{display:flex;flex-direction:column;gap:14px}
.wl-ex{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.wl-exh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.wl-row{display:grid;grid-template-columns:34px minmax(70px,.9fr) minmax(150px,1.6fr) minmax(120px,1.2fr);gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.wl-head{font-size:11.5px;color:var(--faint);border-top:0}
.wl-n{color:var(--muted);font-size:13px;text-align:center}
.wl-goal{font-size:14px}
.wl-in{display:flex;align-items:center;gap:4px;min-width:0}
.wl-in .input{min-width:0;padding-left:6px;padding-right:4px}
.wl-in i{color:var(--faint);font-style:normal}
.wl-lab{display:none;font-style:normal;font-size:12px;color:var(--muted);width:34px;flex:none}
.wl-res{display:flex;gap:4px;flex-wrap:wrap}
.wl-res .tag{font-size:11px;padding:0 5px}
.wl-save{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.wl-done{margin-bottom:14px}
.empty-big{display:flex;flex-direction:column;align-items:flex-start;gap:10px;color:var(--muted)}
@media (max-width:640px){ .wl-row{grid-template-columns:22px 58px minmax(0,1fr);row-gap:4px} .wl-row .wl-res{grid-column:2/-1} .wl-head span:last-child{display:none} .wl-ex{padding:8px}
  .wl-row.wl-edit{grid-template-columns:22px minmax(0,1fr)} .wl-edit>*:not(.wl-n){grid-column:2} .wl-edit .wl-lab{display:inline} }
/* Calendars panel */
.cal-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;align-items:start}
.cal-panel{display:flex;flex-direction:column;gap:8px;position:sticky;top:16px;font-size:13px}
.calrows{display:flex;flex-direction:column}
.calrow{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:5px;font-size:13.5px;min-width:0}
.calrow:hover{background:var(--hover)}
.calrow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calrow .icon-btn{width:24px;height:24px;opacity:.55}
.calrow:hover .icon-btn{opacity:1}
.calchk{border-color:var(--tf)}
.calchk.on{background:var(--tf);border-color:var(--tf)}
.calchk.on::after{border-color:var(--bg)}
@media (max-width:640px){ .cal-right{margin-left:0;width:100%;justify-content:space-between} .month .cell{min-height:74px} }
@media (max-width:1100px){ .cal-layout{grid-template-columns:minmax(0,1fr);gap:16px} .cal-panel{position:static} .calrows{flex-direction:row;flex-wrap:wrap;gap:2px 10px} .calrow .faint{display:none} }
/* Week planner */
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.day{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:180px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline}
.day-h b{font-weight:600}
.day-item{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.day-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Goals */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--card)}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-title{font-weight:600;font-size:15.5px;margin:4px 0 0}
.ms{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.ms .chk{margin-top:2px}
.ms.done span{color:var(--faint);text-decoration:line-through}

/* Habits */
.hgrid-wrap{overflow-x:auto}
table.hgrid{border-collapse:collapse;font-size:12px}
table.hgrid th{font-weight:500;color:var(--faint);padding:2px 1px;text-align:center;min-width:22px;font-variant-numeric:tabular-nums}
table.hgrid th.today{color:var(--bad)}
table.hgrid td{padding:2px 1px;text-align:center}
table.hgrid td.hname{text-align:left;padding-right:12px;white-space:nowrap;font-size:13.5px;min-width:150px}
.hname button{background:none;border:0;padding:0;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.hname button:hover{text-decoration:underline}
.hc{width:21px;height:21px;border-radius:5px;border:1px solid var(--line);background:var(--bg);padding:0;display:block}
.hc:hover{border-color:var(--tf)}
.hc.on{background:var(--tf);border-color:var(--tf)}
.hc:disabled{opacity:.35;cursor:default}
.hstreak{padding-left:17px;white-space:nowrap;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:500}
.mood.on{background:var(--tb);color:var(--tf);border-color:transparent}
.jlist{display:flex;flex-direction:column}
.jitem{display:flex;gap:10px;align-items:baseline;padding:7px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;min-width:0}
.jitem:hover{background:var(--hover)}
.jitem .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}

/* Charts */
.chart{display:flex;align-items:flex-end;gap:8px;height:140px;position:relative;padding-top:8px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.chart .col i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.chart .col i.over{background:var(--bad)}
.chart .col i.dim{opacity:.45}
.chart .col span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);pointer-events:none}
.chart .goal em{position:absolute;right:0;top:-18px;font-size:11px;color:var(--muted);font-style:normal;background:var(--bg);padding:0 4px}
.chart-x{display:flex;gap:8px}
.chart-x span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}

/* Food */
.meal-h{display:flex;justify-content:space-between;align-items:center}
.macro{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.macro b{color:var(--fg);font-variant-numeric:tabular-nums}
.big{font-size:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}

/* Recipes */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.rcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.rcard:hover{box-shadow:var(--shadow)}
.rcover{height:96px;background:var(--tb);color:var(--tf);display:flex;align-items:flex-end;padding:10px 12px;font-family:var(--font-title);font-size:40px;line-height:1;font-weight:600}
.rbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.rbody b{font-size:14.5px}
.rmeta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.rdetail{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:32px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.steps li{padding-left:4px}
.ing{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.ing .chk{margin-top:2px}
.ing.done span{color:var(--faint);text-decoration:line-through}
.props{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;font-size:13.5px;margin-bottom:22px}
.props dt{color:var(--muted)} .props dd{margin:0}

/* Movies */
.stars{display:inline-flex;gap:1px}
.stars button{background:none;border:0;padding:0 1px;font-size:16px;line-height:1;color:var(--line)}
.stars button.on{color:#e0a526}
.stars.ro button{cursor:default}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(20,18,15,.45);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 16px 24px;overflow:auto}
.modal{background:var(--card);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:520px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal h2{font-family:var(--font-title);font-weight:var(--title-w);font-size:calc(var(--title-scale) * 24px)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field.note{gap:8px;font-size:13.5px;color:var(--muted)}
.field.note p{margin:0;line-height:1.5}
.field.note b{color:var(--fg)}
.field label,.field .lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
.field .hint{font-size:12px;color:var(--faint)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{position:relative}
.sw input{position:absolute;opacity:0;inset:0}
.sw span{display:block;width:24px;height:24px;border-radius:6px;background:var(--tb);border:2px solid var(--tf);cursor:pointer}
.sw input:checked + span{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--tf)}
.sw-auto span{width:auto;height:24px;padding:0 8px;font-size:12px;line-height:20px;background:var(--side);border:2px dashed var(--faint);color:var(--muted)}
.sw-auto input:checked + span{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg);border-style:solid}
.hex-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.hex-lbl{font-size:12.5px;color:var(--muted);white-space:nowrap}
.hex-prev{width:24px;height:24px;border-radius:6px;flex:none;border:1px solid var(--line)}
.hex-prev.empty{background:repeating-linear-gradient(45deg,var(--side) 0 4px,var(--bg) 4px 8px)!important}
.hex-in{width:110px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
.hex-in.bad{border-color:var(--bad)}
.hex-pick{width:36px;height:32px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--bg);cursor:pointer;flex:none}
.sw input:focus-visible + span{outline:2px solid var(--accent);outline-offset:3px}
.modal-acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.modal-acts div{display:flex;gap:8px}
.ex-rows{display:flex;flex-direction:column;gap:6px}
.ex-row{display:grid;grid-template-columns:minmax(0,2.4fr) repeat(3,minmax(0,1fr)) 28px;gap:6px;align-items:center}
.ex-head{font-size:11.5px;color:var(--faint)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13.5px;z-index:200;box-shadow:var(--shadow)}

/* Backgrounds (main area) */
.mainwrap{min-width:0;background-color:var(--bg)}
.bg-paper{background-color:color-mix(in srgb,var(--bg) 90%,#d9b77c)}
.bg-dots{background-image:radial-gradient(circle,var(--line) 1.3px,transparent 1.6px);background-size:22px 22px}
.bg-lines{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--line) 27px,var(--line) 28px)}
.bg-grid{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
.bg-tint{background-image:linear-gradient(to bottom,var(--accent-soft),var(--bg) 460px);background-repeat:no-repeat}
.bg-mist{background-image:linear-gradient(200deg,color-mix(in srgb,var(--blue-bg) 85%,var(--bg)) 0,color-mix(in srgb,var(--purple-bg) 70%,var(--bg)) 280px,var(--bg) 640px);background-repeat:no-repeat}
.bg-sunset{background-image:linear-gradient(160deg,color-mix(in srgb,var(--orange-bg) 80%,var(--bg)) 0,color-mix(in srgb,var(--pink-bg) 70%,var(--bg)) 260px,var(--bg) 620px);background-repeat:no-repeat}
.card,.callout,.stats,.rcard,.day,.weekgrid-wrap,.modal{border-radius:var(--radius)}
/* Appearance page */
.custombg{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--card)}
.custombg.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.custombg label{flex:1;min-width:200px}
.custombg input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--bg);cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.opts,.opts.four,.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.opt:hover{border-color:var(--faint)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt .prev{height:84px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;background-color:var(--bg)}
.opt .prev .aa{font-size:34px;line-height:1;color:var(--fg)}
.opt .prev .acc{width:22px;height:22px;border-radius:50%}
.opt .meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.opt .meta b{font-size:13.5px}
.opt .meta span{font-size:12px;color:var(--muted)}

/* Repeating events. ev.repeat is a preset name; 'custom' uses ev.rr = {freq:'day'|'week'|'month'|'year', every:n, days:[0-6], monthBy:'date'|'nth'|'last', until:'YYYY-MM-DD', count:n} */

    case 'none': return null;
    case 'daily': return {freq:'day',every:1};
    case 'weekdays': return {freq:'week',every:1,days:[1,2,3,4,5]};
    case 'weekly': return {freq:'week',every:1,days:[a.getDay()]};
    case 'biweekly': return {freq:'week',every:2,days:[a.getDay()]};
    case 'monthly': return {freq:'month',every:1,monthBy:'date'};
    case 'monthnth': return {freq:'month',every:1,monthBy:'nth'};
    case 'monthlast': return {freq:'month',every:1,monthBy:'last'};

/* app install */
let installState='unavailable', desk=null, deferredPrompt=null;
function installBtn(){
  if(installState==='available') return h('button',{class:'btn sm',style:'align-self:flex-start;margin-bottom:4px',onclick:async()=>{ try{ const r=await desk.install.request(); if(r==='installed'){ installState='installed'; toast('Installing Life Planner…'); renderSide(); } }catch(e){ toast('The app couldn’t be installed.'); } }},ic('plus'),'Install as app');
  if(deferredPrompt) return h('button',{class:'btn sm',style:'align-self:flex-start;margin-bottom:4px',onclick:async()=>{ const p=deferredPrompt; deferredPrompt=null; p.prompt(); try{ await p.userChoice; }catch(e){} renderSide(); }},ic('plus'),'Install app');
  return null;
}
function drawIcon(size=256){
  const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d'); const r=size*.22;
  x.fillStyle='#2c2b28'; x.beginPath(); x.moveTo(r,0); x.arcTo(size,0,size,size,r); x.arcTo(size,size,0,size,r); x.arcTo(0,size,0,0,r); x.arcTo(0,0,size,0,r); x.fill();
  x.fillStyle='#f6f5f2'; x.font=`600 ${size*.62}px Newsreader, Georgia, serif`; x.textAlign='center'; x.textBaseline='middle'; x.fillText('L',size*.5,size*.53);
  return c.toDataURL('image/png');
}
async function initDesktop(){
  if(!window.claude||typeof window.claude.use!=='function') return;
  try{ desk=await window.claude.use('desktop'); if(!desk) return;
    if(desk.app&&desk.app.dock){ try{ if(document.fonts) await document.fonts.ready; }catch(e){} desk.app.dock.setIcon(drawIcon()).catch(()=>{}); }
    if(desk.install){ installState=await desk.install.state(); renderSide(); }
  }catch(e){}
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; renderSide(); });
window.LP_drawIcon=drawIcon;

/* backup */
async function downloadBackup(){
  const data=JSON.stringify(Object.assign({app:'life-planner',version:1,savedAt:new Date().toISOString()},S),null,2);
  let dl=null; try{ dl=window.claude&&await window.claude.use('downloads'); }catch(e){}
  if(!dl){ if(!window.claude){ try{ const a=h('a',{href:URL.createObjectURL(new Blob([data],{type:'application/json'})),download:`life-planner-backup-${today()}.json`}); document.body.append(a); a.click(); a.remove(); toast('Backup saved'); }catch(e){ toast('The backup wasn’t saved.'); } return; } toast('Downloads aren’t available in this view.'); return; }
  try{ const r=await dl.save({filename:`life-planner-backup-${today()}.json`,data}); if(r&&r.status==='saved') toast('Backup saved'); }catch(e){ if(e&&e.code!=='declined'&&e.code!=='dismissed') toast('The backup wasn’t saved.'); }
}
$('#restoreFile').addEventListener('change',e=>{
  const file=e.target.files[0]; e.target.value=''; if(!file) return;
  const rd=new FileReader(); rd.onload=()=>{ let obj; try{ obj=JSON.parse(rd.result) }catch(err){ toast('That file isn’t a planner backup.'); return; }
    if(!obj||obj.app!=='life-planner'){ toast('That file isn’t a planner backup.'); return; }
    openForm({title:'Restore this backup?',saveLabel:'Replace my planner',fields:[],data:{},onSave:()=>{ const now=Date.now(); for(const k in DOCS){ if(obj[k]){ S[k]=Object.assign(DOCS[k](),obj[k]); S[k]._u=now; persistLocal(k); queueDb(k);} } META.example=false; saveMeta(); render(true); toast('Backup restored'); }});
    const m=$('.modal .fields'); if(m) m.replaceWith(h('p',{class:'muted',style:'margin:0'},`Everything in your planner will be replaced with the backup from ${obj.savedAt?new Date(obj.savedAt).toLocaleString():'this file'}.`));
  }; rd.readAsText(file);
});
